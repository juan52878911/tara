[package]
name = "tara"
version = "0.0.1"
edition = "2021"
description = "Estimación de consumo de recursos sin ejecutar, con línea base por commit"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
